<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="./src/output.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Order summary card</title>
</head>

<body class="bg-Pale-blue bg-[url(/assets/images/pattern-background-mobile.svg)] bg-no-repeat bg-contain h-screen grid place-content-center font-Red-Hat-Display text-Dark-blue sm:bg-[url(/assets/images/pattern-background-desktop.svg)]">


  <main>
      

    <div class="w-[327px] bg-white rounded-xl overflow-hidden text-center sm:w-[450px]">
      <img src="./assets/images/illustration-hero.svg" alt="ilustración">


      <div class="p-6 sm:p-12">
        <h1 class="font-black text-[1.375rem] mb-4 sm:text-[1.75rem]">Order Summary</h1>
        <p class="text-Desaturated-blue mb-6 text-[0.9375rem] font-bold mx-2">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
        <div class="flex items-center bg-Very-pale-blue p-4 rounded-[11px] mb-4 sm:mb-8 sm:p-6">
          <img class="mr-5" src="./assets/images/icon-music.svg" alt="icon music">
          <div>
            <p class="text-sm font-black sm:text-base">Annual Plan</p>
            <p class="text-sm text-Desaturated-blue sm:text-base">$59.99/year</p>
          </div>
          <a class="ml-auto text-Bright-blue underline font-bold text-[0.8125rem] cursor-pointer sm:text-base">Change</a>
      </div>  
  
      <button class="bg-Bright-blue block w-full text-white p-4 rounded-[11px] mb-6 font-black text-[0.9375rem] shadow-[0_20px_20px] shadow-Bright-blue/20 cursor-pointer hover:bg-Bright-blue/70"> Proceed to Payment</button>

      <button class="text-[0.9365rem] font-black text-Desaturated-blue cursor-pointer">Cancel Order</button>
      
    </div>
  </main>

</body>
</html>
